    // ═══════════════════════════════════════════════════════════
    // SLIDES TAB — PowerPoint slide export (matches deck template)
    // ═══════════════════════════════════════════════════════════
    function SlidesTab() {
      const [weeks, setWeeks] = useState(2);
      const [recs, setRecs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [generating, setGenerating] = useState(false);
      const [status, setStatus] = useState('');

      useEffect(() => { loadRecs(); }, [weeks]);

      const loadRecs = async () => {
        setLoading(true);
        const since = new Date(Date.now() - weeks * 7 * 86400000).toISOString();
        const q = supabase.from('recognitions').select('*, recognition_sites(name)')
          .eq('approved', true).gte('created_at', since).order('created_at', { ascending: false });
        const { data } = await q;
        setRecs(data || []);
        setStatus('');
        setLoading(false);
      };

      // Show short write-ups in full; truncate long ones cleanly at a word
      // boundary so the person is still recognized without a wall of text.
      const smartTrunc = (t, max = 150) => {
        if (!t) return '';
        t = t.trim().replace(/\s+/g, ' ');
        if (t.length <= max) return t;
        let cut = t.slice(0, max);
        const sp = cut.lastIndexOf(' ');
        if (sp > max * 0.6) cut = cut.slice(0, sp);
        return cut.replace(/[.,;:\s]+$/, '') + '…';
      };

      const VALUE_HEX = {
        'Innovation': '8B5CF6', 'Integrity': '0891B2', 'Hard Work': 'DC2626',
        'Teamwork': '16A34A', 'Passion': 'EA580C'
      };
      const NAVY = '272E72', GOLD = 'D14124', MUTED = '64748B';

      const SW = 13.333, MARGIN = 0.55, GAP = 0.35;
      const CARD_W = (SW - 2 * MARGIN - GAP) / 2;
      const FULL_W = SW - 2 * MARGIN;
      const CARD_H = 1.3, WIDE_H = 1.55, ROW_GAP = 0.22, TOP = 1.8;
      const BOTTOM = 6.55; // content stops above the mountain footer art
      const colX = [MARGIN, MARGIN + CARD_W + GAP];
      const PILL_W = 1.75, PILL_H = 0.32;

      // Rough Arial advance width, in inches. Only used to decide how big a
      // name is — a group recognition can carry a dozen names and must not
      // spill out of its card.
      const estW = (s, pt, bold) => (s || '').length * pt * (bold ? 0.55 : 0.5) / 72;
      const nameBoxW = cardW => cardW - 0.62 - PILL_W - 0.32;

      // Largest size at which the name still fits inside maxLines.
      const fitPt = (name, boxW, maxLines, hi, lo) => {
        for (let pt = hi; pt > lo; pt -= 0.5)
          if (estW(name, pt, true) <= boxW * maxLines * 0.94) return pt;
        return lo;
      };

      // Drop whole names (never half a name) if even the wide card can't hold them.
      const fitNames = (name, boxW, maxLines, pt) => {
        if (estW(name, pt, true) <= boxW * maxLines * 0.94) return name;
        const parts = (name || '').split(/\s*,\s*/).filter(Boolean);
        for (let keep = parts.length - 1; keep >= 1; keep--) {
          const s = parts.slice(0, keep).join(', ') + ` +${parts.length - keep} more`;
          if (estW(s, pt, true) <= boxW * maxLines * 0.94) return s;
        }
        return name;
      };

      // Flow the cards into pages: half-width cards pair up, and a recognition
      // whose name won't sit on one line of a half-width card (i.e. a team
      // award) takes a full-width row rather than overflowing its card.
      const planPages = list => {
        const pages = [];
        let cur = [], y = TOP, col = 0;
        const closePage = () => { if (cur.length) pages.push(cur); cur = []; y = TOP; col = 0; };
        list.forEach(r => {
          const nm = r.recipient_name || '—';
          const wide = estW(nm, 15, true) > nameBoxW(CARD_W) * 0.94;
          const it = { r, nm, wide, h: wide ? WIDE_H : CARD_H };
          if (wide) {
            if (col === 1) { y += CARD_H + ROW_GAP; col = 0; }
            if (y + it.h > BOTTOM) closePage();
            cur.push({ ...it, x: MARGIN, y, w: FULL_W });
            y += it.h + ROW_GAP;
          } else if (col === 0) {
            if (y + it.h > BOTTOM) closePage();
            cur.push({ ...it, x: colX[0], y, w: CARD_W });
            col = 1;
          } else {
            cur.push({ ...it, x: colX[1], y, w: CARD_W });
            y += it.h + ROW_GAP; col = 0;
          }
        });
        closePage();
        return pages;
      };

      const slideCount = useMemo(() => planPages(recs).length, [recs]);

      const generatePptx = async () => {
        if (!recs.length || typeof PptxGenJS === 'undefined') {
          setStatus(typeof PptxGenJS === 'undefined' ? '⚠ Slide library failed to load — check your connection and retry.' : '');
          return;
        }
        setGenerating(true);
        setStatus('Building slides…');
        try {
          const fmt = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const startLbl = fmt(recs[recs.length - 1].created_at);
          const endLbl = fmt(recs[0].created_at);
          const year = new Date(recs[0].created_at).getFullYear();
          const rangeLabel = startLbl === endLbl ? `${startLbl}, ${year}` : `${startLbl} – ${endLbl}, ${year}`;

          // Canyon Labs template chrome (logo + mountain footer + © line)
          // as a full-bleed background; content is drawn on the white canvas.
          let bg = null;
          try {
            const blob = await fetch('slide-template-bg.png').then(r => r.blob());
            bg = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
          } catch (_) { /* falls back to plain white */ }

          const pptx = new PptxGenJS();
          pptx.layout = 'LAYOUT_WIDE'; // 13.333 x 7.5 in — matches the template
          pptx.author = 'Canyon Kudos';
          pptx.title = 'Canyon Labs Bracelet Awards';

          const pages = planPages(recs);

          pages.forEach((page, pi) => {
            const slide = pptx.addSlide();
            if (bg) slide.addImage({ data: bg, x: 0, y: 0, w: SW, h: 7.5 });
            else slide.background = { color: 'FFFFFF' };

            // ── Title (top-left white area; no accent line) ──
            slide.addText('Bracelet Awards', { x: MARGIN, y: 0.5, w: 8.5, h: 0.6, fontFace: 'Arial', fontSize: 30, bold: true, color: NAVY, margin: 0 });
            slide.addText(`${rangeLabel}   ·   ${recs.length} recognition${recs.length !== 1 ? 's' : ''}`,
              { x: MARGIN, y: 1.16, w: 8.5, h: 0.34, fontFace: 'Arial', fontSize: 13, color: MUTED, margin: 0 });

            // ── Recognition cards (white card + value pill; no edge stripe) ──
            page.forEach(c => {
              const r = c.r, cx = c.x, cy = c.y, cw = c.w, ch = c.h;
              const vhex = VALUE_HEX[r.core_value] || GOLD;
              slide.addShape(pptx.ShapeType.roundRect, { x: cx, y: cy, w: cw, h: ch, rectRadius: 0.06, fill: { color: 'FFFFFF' }, line: { color: 'E2E8F0', width: 1 }, shadow: { type: 'outer', blur: 5, offset: 2, angle: 90, color: 'A0A0A0', opacity: 0.28 } });
              // small value-colored dot — recurring motif, not an edge stripe
              slide.addShape(pptx.ShapeType.ellipse, { x: cx + 0.3, y: cy + 0.34, w: 0.15, h: 0.15, fill: { color: vhex } });

              const nameX = cx + 0.62, innerX = cx + 0.3, innerW = cw - 0.6;
              const nw = nameBoxW(cw), nameH = c.wide ? 0.62 : 0.4;
              const namePt = fitPt(c.nm, nw, 2, 15, c.wide ? 10 : 11);
              // recipient (leave room for the value pill on the right)
              slide.addText(fitNames(c.nm, nw, 2, namePt), { x: nameX, y: cy + 0.18, w: nw, h: nameH, fontFace: 'Arial', fontSize: namePt, bold: true, color: NAVY, valign: 'middle', margin: 0 });
              // value pill
              slide.addShape(pptx.ShapeType.roundRect, { x: cx + cw - PILL_W - 0.24, y: cy + 0.22, w: PILL_W, h: PILL_H, rectRadius: 0.16, fill: { color: vhex } });
              slide.addText((r.core_value || '').toUpperCase(), { x: cx + cw - PILL_W - 0.24, y: cy + 0.22, w: PILL_W, h: PILL_H, align: 'center', valign: 'middle', fontFace: 'Arial', fontSize: 8.5, bold: true, color: 'FFFFFF', margin: 0 });
              // meta line
              const metaY = cy + 0.18 + nameH;
              slide.addText(`from ${r.nominator_name || 'Anonymous'} · ${fmt(r.created_at)}`,
                { x: innerX, y: metaY, w: innerW, h: 0.26, fontFace: 'Arial', fontSize: 9.5, italic: true, color: MUTED, margin: 0 });
              // description (short in full, long truncated cleanly)
              const desc = smartTrunc(r.description, c.wide ? 300 : 135);
              if (desc) slide.addText(desc, { x: innerX, y: metaY + 0.28, w: innerW, h: cy + ch - (metaY + 0.28) - 0.08, fontFace: 'Arial', fontSize: 10, color: '475569', valign: 'top', lineSpacingMultiple: 1.02, margin: 0 });
            });

            // ── Page number (white, over the mountain footer) ──
            if (pages.length > 1)
              slide.addText(`${pi + 1} / ${pages.length}`, { x: SW - 1.5, y: 7.0, w: 1.1, h: 0.35, align: 'right', fontFace: 'Arial', fontSize: 11, color: 'FFFFFF', margin: 0 });
          });

          const fn = `Canyon-Kudos-Recognition_${startLbl}-${endLbl}_${year}`.replace(/[^A-Za-z0-9_\-]/g, '') + '.pptx';
          await pptx.writeFile({ fileName: fn });
          setStatus(`✓ Downloaded ${pages.length} slide${pages.length !== 1 ? 's' : ''} covering ${recs.length} recognition${recs.length !== 1 ? 's' : ''}.`);
        } catch (e) {
          console.error(e);
          setStatus('⚠ ' + (e.message || 'Generation failed.'));
        }
        setGenerating(false);
      };

      return (
        <div>
          <div className="card" style={{ marginBottom: 24 }}>
            <h3 style={{ marginBottom: 8 }}>Generate Recognition Slide</h3>
            <p style={{ fontSize: 14, color: 'var(--canyon-muted)', marginBottom: 20 }}>
              Export approved recognitions into a PowerPoint slide (.pptx) you can drop straight into a deck.
              Everyone submitted is recognized; short write-ups show in full, long ones are trimmed cleanly. Overflows onto extra slides automatically.
            </p>
            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'end' }}>
              <div>
                <label className="form-label">Window</label>
                <select className="form-select" value={weeks} onChange={e => setWeeks(parseInt(e.target.value))} style={{ minWidth: 150 }}>
                  <option value={1}>Last 1 week</option>
                  <option value={2}>Last 2 weeks</option>
                  <option value={4}>Last 4 weeks</option>
                  <option value={8}>Last 8 weeks</option>
                </select>
              </div>
              <button className="btn btn-primary" onClick={generatePptx} disabled={loading || generating || recs.length === 0}>
                {generating ? 'Generating…' : `📊 Generate Slide${slideCount !== 1 ? 's' : ''} (${recs.length})`}
              </button>
            </div>
            {status && <p style={{ fontSize: 14, marginTop: 16, marginBottom: 0, color: status[0] === '⚠' ? '#9D2235' : 'var(--canyon-navy)', fontWeight: 600 }}>{status}</p>}
          </div>

          <p style={{ fontSize: 14, color: 'var(--canyon-muted)', marginBottom: 16 }}>
            {loading ? 'Loading…' : `Preview — ${recs.length} recognition${recs.length !== 1 ? 's' : ''} in window (${slideCount} slide${slideCount !== 1 ? 's' : ''}):`}
          </p>
          <div className="rec-list">
            {recs.map(r => <RecCard key={r.id} rec={r} />)}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════
    // EMAIL / PDF EXPORT TAB
    // ═══════════════════════════════════════════════════════════

    // Date inputs hand back 'YYYY-MM-DD'. `new Date('2026-07-20')` reads that as
    // UTC midnight, which is the 19th anywhere west of Greenwich — so always
    // build these from parts and keep every boundary in local time.
    const parseYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const fmtYMD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    // Monday of the week containing d — the program runs on Mon–Sun weeks.
    const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

    // Coverage strip for the weekly posting. The Mon–Sun arithmetic is sound,
    // but two operational mistakes are invisible without a record: posting
    // "This week" mid-week and then "Last week" on Monday sends the same days
    // twice, and missing a Monday loses seven days with nobody the wiser.
    function PostingCoverage({ postings, from, to, weeks = 10 }) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const thisMon = mondayOf(today);
      const covered = (s, e) => postings.some(p =>
        p.range_start <= fmtYMD(s) && p.range_end >= fmtYMD(e));
      const partly = (s, e) => postings.some(p =>
        p.range_start <= fmtYMD(e) && p.range_end >= fmtYMD(s));

      const cells = [];
      for (let i = weeks - 1; i >= 0; i--) {
        const s = addDays(thisMon, -7 * i);
        const e = addDays(s, 6);
        const isThis = i === 0;
        const full = covered(s, e), some = !full && partly(s, e);
        // Only completed weeks count as a gap; the current one isn't due yet.
        const gap = !full && !some && !isThis;
        const selected = from <= fmtYMD(e) && to >= fmtYMD(s);
        cells.push({ s, e, full, some, gap, isThis, selected });
      }
      const gaps = cells.filter(c => c.gap).length;

      return (
        <div style={{ marginBottom: 18 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {cells.map((c, i) => (
              <div key={i}
                title={`${fmtYMD(c.s)} – ${fmtYMD(c.e)}\n${c.full ? 'Posted' : c.some ? 'Partly posted' : c.isThis ? 'Current week' : 'Not posted'}`}
                style={{
                  flex: 1, height: 34, borderRadius: 6, display: 'flex', alignItems: 'center',
                  justifyContent: 'center', fontSize: 10, fontWeight: 700, cursor: 'help',
                  background: c.full ? '#dcfce7' : c.some ? '#fef3c7' : c.gap ? '#fee2e2' : '#f1f5f9',
                  color: c.full ? '#166534' : c.some ? '#92400e' : c.gap ? '#9D2235' : 'var(--canyon-muted)',
                  outline: c.selected ? '2px solid var(--canyon-purple)' : 'none',
                  outlineOffset: -2,
                }}>
                {c.full ? '✓' : c.some ? '◐' : c.gap ? '!' : '·'}
              </div>
            ))}
          </div>
          <p style={{ fontSize: 12, color: gaps ? '#9D2235' : 'var(--canyon-muted)', marginTop: 6, marginBottom: 0 }}>
            {gaps
              ? `⚠ ${gaps} week${gaps !== 1 ? 's' : ''} in the last ${weeks} never posted — hover to see which.`
              : `Last ${weeks} weeks · ✓ posted · ◐ partly · · current week`}
          </p>
        </div>
      );
    }

    const presetRange = p => {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const thisMon = mondayOf(today);
      if (p === 'thisweek') return [thisMon, today];
      if (p === 'lastweek') return [addDays(thisMon, -7), addDays(thisMon, -1)];
      if (p === 'last2') return [addDays(thisMon, -14), addDays(thisMon, -1)];
      return [addDays(thisMon, -7), addDays(thisMon, -1)];
    };

    // Mirrors the wording Rochester already uses ("Awarded Week of July 20th, 2026")
    // when the range is a whole Mon–Sun week, and degrades to explicit dates otherwise.
    const rangeLabel = (from, to) => {
      const days = Math.round((to - from) / 86400000);
      if ((from.getDay() + 6) % 7 === 0 && days === 6)
        return `Awarded Week of ${MONTHS[from.getMonth()]} ${ordinal(from.getDate())}, ${from.getFullYear()}`;
      if (days === 0)
        return `Awarded ${MONTHS[from.getMonth()]} ${from.getDate()}, ${from.getFullYear()}`;
      const sameYear = from.getFullYear() === to.getFullYear();
      const left = `${MONTHS[from.getMonth()]} ${from.getDate()}` + (sameYear ? '' : `, ${from.getFullYear()}`);
      return `Awarded ${left} – ${MONTHS[to.getMonth()]} ${to.getDate()}, ${to.getFullYear()}`;
    };

    // Submissions are typed in a hurry, so "wendy mach" is common. Capitalise a
    // token only when it is entirely lowercase — that leaves deliberate internal
    // capitals ("McElroy", "LaPierre", "DeSoto") exactly as the submitter typed them.
    const tidyName = s => (s || '').trim().split(/\s+/)
      .map(w => (w === w.toLowerCase() ? w.charAt(0).toUpperCase() + w.slice(1) : w))
      .join(' ');

    const nominatorLine = r =>
      (r.nominator_name || '').trim().toLowerCase() === 'anonymous'
        ? 'From: Anonymous'
        : `Nominated by ${tidyName(r.nominator_name)}`;

    // jsPDF's built-in Helvetica is WinAnsi-encoded: emoji and other exotic
    // codepoints render as garbage. Normalise smart punctuation to its ASCII
    // equivalent and drop anything the font can't draw.
    const pdfSafe = s => (s || '')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/[–—]/g, '-')
      .replace(/…/g, '...')
      .replace(/[^\x20-\x7E\xA0-\xFF]/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    const escHtml = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const collapse = s => (s || '').replace(/\s+/g, ' ').trim();

    const PDF_NAVY = [39, 46, 114], PDF_GOLD = [209, 65, 36];
    const PDF_INK = [51, 65, 85], PDF_MUTED = [100, 116, 139];
    const VALUE_RGB = {
      'Innovation': [139, 92, 246], 'Integrity': [8, 145, 178], 'Hard Work': [220, 38, 38],
      'Teamwork': [22, 163, 74], 'Passion': [234, 88, 12]
    };
    const VALUE_HEXC = {
      'Innovation': '#8B5CF6', 'Integrity': '#0891B2', 'Hard Work': '#DC2626',
      'Teamwork': '#16A34A', 'Passion': '#EA580C'
    };

    // Same-origin PNG → data URL, so jsPDF can embed it. Downscale first:
    // jsPDF stores the bitmap at full resolution, and the posting gets emailed
    // around, so a full-size logo would dominate the file.
    const loadImageData = (src, maxW) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = maxW && img.naturalWidth > maxW ? maxW / img.naturalWidth : 1;
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('logo load failed'));
      img.src = src;
    });

    function ExportTab() {
      const [preset, setPreset] = useState('lastweek');
      const [from, setFrom] = useState(() => fmtYMD(presetRange('lastweek')[0]));
      const [to, setTo] = useState(() => fmtYMD(presetRange('lastweek')[1]));
      const [recs, setRecs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState('');
      const [status, setStatus] = useState('');
      const [postings, setPostings] = useState([]);
      const [onScreen, setOnScreen] = useState(false);

      useEffect(() => {
        if (preset === 'custom') return;
        const [f, t] = presetRange(preset);
        setFrom(fmtYMD(f)); setTo(fmtYMD(t));
      }, [preset]);

      useEffect(() => { load(); }, [from, to]);
      useEffect(() => { loadPostings(); }, []);

      const loadPostings = async () => {
        try {
          const { postings } = await adminCall('loadPostings');
          setPostings(postings || []);
        } catch (e) { if (!e.unauthorized) console.error(e); }
      };

      // Any previously posted range touching this one means days would go out
      // a second time.
      const overlapping = postings.filter(p => p.range_start <= to && p.range_end >= from);
      const alreadyPosted = overlapping.some(p => p.range_start <= from && p.range_end >= to);

      const markPosted = async () => {
        setBusy('mark');
        try {
          await adminCall('insertPosting', {
            range_start: from, range_end: to,
            recognition_count: recs.length,
            note: subtitle,
          });
          await loadPostings();
          setStatus(`✓ Marked ${from} – ${to} as posted.`);
        } catch (e) {
          if (!e.unauthorized) setStatus('⚠ ' + (e.message || 'Could not record the posting.'));
        }
        setBusy('');
      };

      const invalid = parseYMD(from) > parseYMD(to);

      const load = async () => {
        if (invalid) { setRecs([]); setLoading(false); return; }
        setLoading(true); setStatus('');
        const start = parseYMD(from);
        const end = addDays(parseYMD(to), 1); // exclusive upper bound
        const { data } = await supabase.from('recognitions').select('*, recognition_sites(name)')
          .eq('approved', true)
          .gte('created_at', start.toISOString())
          .lt('created_at', end.toISOString())
          .order('created_at', { ascending: true });
        setRecs(data || []);
        setLoading(false);
      };

      const subtitle = invalid ? '' : rangeLabel(parseYMD(from), parseYMD(to));
      const fileBase = `Bracelet-Awards_${from}_to_${to}`;

      const downloadPdf = async () => {
        if (!recs.length) return;
        setBusy('pdf'); setStatus('');
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'pt', format: 'letter' });
          const PW = doc.internal.pageSize.getWidth();
          const PH = doc.internal.pageSize.getHeight();
          const M = 54, CW = PW - M * 2, BOTTOM = PH - 62;

          let logo = null;
          try { logo = await loadImageData('canyon-labs-logo-white.png', 276); } catch (_) { /* title alone is fine */ }

          const titleBar = () => {
            doc.setFillColor(...PDF_NAVY); doc.rect(0, 0, PW, 112, 'F');
            doc.setFillColor(...PDF_GOLD); doc.rect(0, 112, PW, 4, 'F');
            if (logo) doc.addImage(logo, 'PNG', M, 20, 92, 92 / 2.071, undefined, 'FAST');
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
            doc.text('Employee Achievement Bracelet Awards', M, 96);
            doc.setTextColor(...PDF_NAVY);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
            doc.text(pdfSafe(subtitle), M, 146);
            return 178;
          };

          const contBar = () => {
            doc.setFillColor(...PDF_NAVY); doc.rect(0, 0, PW, 34, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
            doc.text('Employee Achievement Bracelet Awards', M, 22);
            return 68;
          };

          // Lay each award out before drawing it, so a block never straddles a page.
          const measure = r => {
            doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
            const nameLines = doc.splitTextToSize(pdfSafe(tidyName(r.recipient_name)) || '-', CW - 150);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
            const descLines = doc.splitTextToSize(pdfSafe(r.description), CW);
            const h = (nameLines.length - 1) * 17 + 15 + 16 + (descLines.length - 1) * 14.5 + 18 + 24;
            return { nameLines, descLines, h };
          };

          const draw = (r, m, y) => {
            const pill = pdfSafe(r.core_value);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
            const pw = doc.getTextWidth(pill) + 20;
            doc.setFillColor(...(VALUE_RGB[r.core_value] || PDF_MUTED));
            doc.roundedRect(M + CW - pw, y - 11, pw, 16, 8, 8, 'F');
            doc.setTextColor(255, 255, 255);
            doc.text(pill, M + CW - pw + 10, y + 0.5);

            doc.setTextColor(...PDF_NAVY);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
            m.nameLines.forEach((ln, i) => doc.text(ln, M, y + i * 17));
            let cy = y + (m.nameLines.length - 1) * 17 + 15;

            doc.setTextColor(...PDF_MUTED);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
            doc.text(pdfSafe(nominatorLine(r)), M, cy);
            cy += 16;

            doc.setTextColor(...PDF_INK); doc.setFontSize(10.5);
            m.descLines.forEach((ln, i) => doc.text(ln, M, cy + i * 14.5));
            cy += (m.descLines.length - 1) * 14.5 + 18;

            doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.7);
            doc.line(M, cy, M + CW, cy);
            return cy + 24;
          };

          let y = titleBar();
          recs.forEach(r => {
            const m = measure(r);
            if (y + m.h > BOTTOM) { doc.addPage(); y = contBar(); }
            y = draw(r, m, y);
          });

          const total = doc.internal.getNumberOfPages();
          for (let i = 1; i <= total; i++) {
            doc.setPage(i);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
            doc.setTextColor(...PDF_MUTED);
            doc.text('Canyon Labs  ·  Employee Achievement Bracelet Awards', M, PH - 34);
            doc.text(`Page ${i} of ${total}`, PW - M, PH - 34, { align: 'right' });
          }

          doc.save(fileBase + '.pdf');
          setStatus(`✓ Downloaded ${fileBase}.pdf — ${recs.length} award${recs.length !== 1 ? 's' : ''} over ${total} page${total !== 1 ? 's' : ''}.`);
        } catch (e) {
          console.error(e);
          setStatus('⚠ ' + (e.message || 'PDF generation failed.'));
        }
        setBusy('');
      };

      // Table-based, fully inline-styled markup — Outlook strips stylesheets
      // and ignores flexbox, so this is the layout that survives a paste.
      const emailHtml = () => {
        const blocks = recs.map(r => `
      <tr><td style="padding:0 0 24px 0;">
        <div style="font:700 16px 'Segoe UI',Arial,sans-serif;color:#272E72;">${escHtml(tidyName(r.recipient_name))}</div>
        <div style="margin:6px 0 8px 0;">
          <span style="background:${VALUE_HEXC[r.core_value] || '#64748B'};color:#ffffff;border-radius:11px;padding:3px 11px;font:700 11px 'Segoe UI',Arial,sans-serif;">${escHtml(r.core_value)}</span>
          <span style="font:400 12px 'Segoe UI',Arial,sans-serif;color:#64748B;padding-left:8px;">${escHtml(nominatorLine(r))}</span>
        </div>
        <div style="font:400 14px/1.55 'Segoe UI',Arial,sans-serif;color:#334155;">${escHtml(collapse(r.description))}</div>
      </td></tr>`).join('');
        return `<table cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:640px;font-family:'Segoe UI',Arial,sans-serif;">
  <tr><td style="border-bottom:3px solid #D14124;padding-bottom:10px;">
    <div style="font:700 20px 'Segoe UI',Arial,sans-serif;color:#272E72;">Employee Achievement Bracelet Awards</div>
    <div style="font:400 14px 'Segoe UI',Arial,sans-serif;color:#64748B;padding-top:4px;">${escHtml(subtitle)}</div>
  </td></tr>
  <tr><td style="height:22px;line-height:22px;">&nbsp;</td></tr>
  ${blocks}
  <tr><td style="border-top:1px solid #E2E8F0;padding-top:10px;font:400 12px 'Segoe UI',Arial,sans-serif;color:#64748B;">
    Come see your site's recognition contact to pick up your bracelet. Congratulations, everyone!
  </td></tr>
</table>`;
      };

      const emailText = () => {
        const head = `Employee Achievement Bracelet Awards\n${subtitle}\n\n`;
        return head + recs.map(r =>
          `${tidyName(r.recipient_name)}\nCore Value: ${r.core_value}\n${nominatorLine(r)}\n${collapse(r.description)}\n`
        ).join('\n');
      };

      const copyEmail = async () => {
        if (!recs.length) return;
        setBusy('email'); setStatus('');
        const html = emailHtml(), text = emailText();
        const ok = () => setStatus('✓ Email body copied — paste straight into Outlook, then attach the PDF.');
        try {
          await navigator.clipboard.write([new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([text], { type: 'text/plain' })
          })]);
          ok();
        } catch (_) {
          // Older browsers have no ClipboardItem — copy a live selection instead.
          try {
            const holder = document.createElement('div');
            holder.contentEditable = 'true';
            holder.style.cssText = 'position:fixed;left:-9999px;top:0;';
            holder.innerHTML = html;
            document.body.appendChild(holder);
            const range = document.createRange(); range.selectNodeContents(holder);
            const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
            document.execCommand('copy');
            sel.removeAllRanges(); document.body.removeChild(holder);
            ok();
          } catch (e) {
            setStatus('⚠ Could not reach the clipboard — ' + (e.message || 'blocked by the browser') + '.');
          }
        }
        setBusy('');
      };

      // A readable, projectable rendering of exactly the selected range,
      // inside the app — the posting is often wanted on a screen in a meeting
      // rather than as a file to attach.
      if (onScreen) {
        return (
          <div className="onscreen-view">
            <div className="onscreen-head">
              <div>
                <h1>Employee Achievement Bracelet Awards</h1>
                <p>{subtitle} · {recs.length} recognition{recs.length !== 1 ? 's' : ''}</p>
              </div>
              <button className="btn" onClick={() => setOnScreen(false)}
                style={{ background: 'rgba(255,255,255,0.15)', color: '#fff', border: 'none' }}>Close</button>
            </div>
            <div className="onscreen-body">
              {recs.map(r => (
                <div key={r.id} className="onscreen-card">
                  <div className="onscreen-name">{tidyName(r.recipient_name)}</div>
                  <div className="onscreen-meta">
                    <span className={'value-pill ' + VALUE_CLASS(r.core_value)}
                      style={{ padding: '3px 12px', fontSize: 12 }}>
                      {VALUE_ICONS[r.core_value]} {r.core_value}
                    </span>
                    <span>{nominatorLine(r)}</span>
                    <span>{new Date(r.created_at).toLocaleDateString()}</span>
                  </div>
                  <div className="onscreen-desc">{collapse(r.description)}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="card" style={{ marginBottom: 24 }}>
            <h3 style={{ marginBottom: 8 }}>Weekly Bracelet Awards Posting</h3>
            <p style={{ fontSize: 14, color: 'var(--canyon-muted)', marginBottom: 20 }}>
              Pick a date range, then download the posting as a PDF to attach and copy the matching
              email body to paste into Outlook. Everything submitted in the window is included —
              nothing is trimmed.
            </p>

            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'end', marginBottom: 16 }}>
              <div>
                <label className="form-label">Range</label>
                <select className="form-select" value={preset} onChange={e => setPreset(e.target.value)} style={{ minWidth: 190 }}>
                  <option value="lastweek">Last week (Mon–Sun)</option>
                  <option value="thisweek">This week (Mon–today)</option>
                  <option value="last2">Last 2 weeks</option>
                  <option value="custom">Custom…</option>
                </select>
              </div>
              <div>
                <label className="form-label">From</label>
                <input className="form-input" type="date" value={from}
                  onChange={e => { setPreset('custom'); setFrom(e.target.value); }} style={{ minWidth: 150 }} />
              </div>
              <div>
                <label className="form-label">To</label>
                <input className="form-input" type="date" value={to}
                  onChange={e => { setPreset('custom'); setTo(e.target.value); }} style={{ minWidth: 150 }} />
              </div>
            </div>

            <PostingCoverage postings={postings} from={from} to={to} />

            {invalid ? (
              <p style={{ fontSize: 14, color: '#9D2235', fontWeight: 600, margin: 0 }}>
                ⚠ The “From” date is after the “To” date.
              </p>
            ) : (
              <>
                {overlapping.length > 0 && (
                  <p style={{ fontSize: 13, color: '#92400e', background: '#fef3c7', border: '1px solid #fde68a',
                              borderRadius: 8, padding: '10px 12px', marginBottom: 14, fontWeight: 600 }}>
                    {alreadyPosted
                      ? `⚠ This exact range was already posted on ${new Date(overlapping[0].posted_at).toLocaleDateString()} — sending it again would repeat those recognitions.`
                      : `⚠ Overlaps a posting already sent (${overlapping[0].range_start} – ${overlapping[0].range_end}). Those days would go out twice.`}
                  </p>
                )}
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
                  <button className="btn btn-primary" onClick={downloadPdf}
                    disabled={loading || !!busy || recs.length === 0}>
                    {busy === 'pdf' ? 'Building…' : `📄 Download PDF (${recs.length})`}
                  </button>
                  <button className="btn btn-gold" onClick={copyEmail}
                    disabled={loading || !!busy || recs.length === 0}>
                    {busy === 'email' ? 'Copying…' : '📧 Copy email body'}
                  </button>
                  <button className="btn" onClick={() => setOnScreen(true)}
                    disabled={loading || recs.length === 0}
                    style={{ background: '#f1f5f9', color: 'var(--canyon-navy)', fontWeight: 600 }}>
                    🖥️ Show on screen
                  </button>
                  <button className="btn" onClick={markPosted}
                    disabled={loading || !!busy || recs.length === 0 || alreadyPosted}
                    style={{ background: alreadyPosted ? '#dcfce7' : '#fff', color: alreadyPosted ? '#166534' : 'var(--canyon-navy)',
                             border: '1px solid #cbd5e1', fontWeight: 600 }}>
                    {alreadyPosted ? '✓ Recorded as posted' : busy === 'mark' ? 'Recording…' : 'Mark as posted'}
                  </button>
                  <span style={{ fontSize: 13, color: 'var(--canyon-muted)' }}>{subtitle}</span>
                </div>
              </>
            )}

            {status && <p style={{ fontSize: 14, marginTop: 16, marginBottom: 0, color: status[0] === '⚠' ? '#9D2235' : 'var(--canyon-navy)', fontWeight: 600 }}>{status}</p>}
          </div>

          <p style={{ fontSize: 14, color: 'var(--canyon-muted)', marginBottom: 16 }}>
            {loading ? 'Loading…' : `Preview — ${recs.length} recognition${recs.length !== 1 ? 's' : ''} in range:`}
          </p>
          {!loading && recs.length === 0 && !invalid && (
            <p style={{ color: 'var(--canyon-muted)', textAlign: 'center', padding: 32 }}>
              No recognitions were submitted in this range.
            </p>
          )}
          <div className="rec-list">
            {recs.map(r => <RecCard key={r.id} rec={r} />)}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════
    // APP ROOT
    // ═══════════════════════════════════════════════════════════
    function App() {
      const [page, setPage] = useState('submit');
      const [sites, setSites] = useState([]);

      // Check URL params for TV mode
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('view') === 'tv') setPage('tv');
      }, []);

      useEffect(() => { loadSites(); }, []);

      const loadSites = async () => {
        const { data } = await supabase.from('recognition_sites').select('*').order('name');
        setSites(data || []);
      };

      // TV display is full-screen, no nav
      if (page === 'tv') {
        return (
          <div>
            <TVDisplay />
            <button onClick={() => setPage('submit')}
              style={{ position: 'fixed', top: 12, right: 12, zIndex: 10, background: 'rgba(255,255,255,0.1)', color: 'rgba(255,255,255,0.4)', border: 'none', borderRadius: 8, padding: '6px 12px', cursor: 'pointer', fontSize: 12 }}>
              Exit TV
            </button>
          </div>
        );
      }

      return (
        <div>
          <Nav page={page} setPage={setPage} />
          {page === 'submit' && <SubmitPage sites={sites} />}
          {page === 'feed' && <FeedPage sites={sites} />}
          {page === 'admin' && <AdminPage sites={sites} reloadSites={loadSites} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
